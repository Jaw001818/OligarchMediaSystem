<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <rect width="512" height="512" rx="128" fill="#0f172a"/>
  <!-- Decorative background glow -->
  <circle cx="256" cy="256" r="180" fill="none" stroke="url(#glowGradient)" stroke-width="8" opacity="0.4"/>
  <!-- The "OM" Monogram / Waveform / Play Button -->
  <g transform="translate(100, 116)">
    <!-- O Shape with custom premium style -->
    <path d="M 100,20 C 55,20 20,55 20,100 C 20,145 55,180 100,180 C 145,180 180,145 180,100 C 180,55 145,20 100,20 Z" fill="none" stroke="url(#primaryGradient)" stroke-width="24" stroke-linecap="round"/>
    <!-- M Shape / Play waveform inside -->
    <path d="M 120,60 L 150,140 L 180,80 L 210,140 L 240,60" fill="none" stroke="url(#secondaryGradient)" stroke-width="20" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <defs>
    <linearGradient id="primaryGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1"/> <!-- indigo-500 -->
      <stop offset="100%" stop-color="#06b6d4"/> <!-- cyan-500 -->
    </linearGradient>
    <linearGradient id="secondaryGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4"/> <!-- cyan-500 -->
      <stop offset="100%" stop-color="#3b82f6"/> <!-- blue-500 -->
    </linearGradient>
    <radialGradient id="glowGradient" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0"/>
    </radialGradient>
  </defs>
</svg>
